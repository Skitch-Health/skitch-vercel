<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skitch — Signing you in</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FFFFFF;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container { text-align: center; max-width: 360px; }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 12px;
    }
    p { font-size: 15px; color: #6B7280; line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #E5E5E5;
      border-top-color: #046A38;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Signing you in.</h1>
    <p>You'll be redirected to Skitch in a moment.</p>
  </div>
</body>
</html>
